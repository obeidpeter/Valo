# CI quality gate (TRD Section 9, CORE-06): merges are blocked on the
# golden-file UBL round-trip tests, the migration rollback test against a real
# Postgres, generated-client drift, full typecheck and production builds.
name: CI

# The token's default scope is the weakest link in the artifact provenance that
# release preparation trusts (R113): every step reads the checkout and uploads
# its artifacts through the runner's own token, so the workflow token needs
# nothing beyond read access to contents. Widen per job if a step ever needs
# more, never here.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger — added when GitHub's webhook-event run creation wedged
  # (deadlocked concurrency group + dead event pipeline); also useful for
  # ad-hoc re-verification.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # Headroom for the expanded DB/rollback/upgrade suites and restore drill.
    # Full CI duration must still be measured; local non-DB timings are in the evidence log.
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://meridian:meridian@127.0.0.1:5432/meridian_ci
      E2E_DATABASE_DISPOSABLE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm run architecture:check

      - name: Quality, release, worker, load-tool and journey regression tests
        run: node --test scripts/src/quality/*.test.mjs scripts/src/ops/*.test.mjs scripts/src/load-smoke.test.mjs scripts/src/e2e/service-worker.test.mjs scripts/src/e2e/journeys/*.test.mjs

      - name: Client transport and database deadline configuration tests
        run: node node_modules/tsx/dist/cli.mjs --test lib/api-client-react/test/custom-fetch.test.ts lib/db/src/connection-config.test.ts

      - name: Tracked secret scan
        run: pnpm run security:secrets

      - name: Documentation inventory
        run: pnpm run docs:check

      # The source-copy brand gate (product name, favicon mark, manifests); the
      # asset-integrity check further down covers the generated images.
      - name: Brand copy gate
        run: pnpm run brand:check

      # The complexity ratchet (R122): every function over the threshold in
      # complexity-baseline.json must be in the baseline at or under its
      # recorded value. New hotspots and growth fail; shrinkage is advice.
      - name: Complexity ratchet
        run: pnpm run complexity:check

      # Formatting (R124): every code file Prettier covers (.prettierignore
      # keeps the generated clients, build output and the non-code formats
      # out) must already be formatted; `pnpm run format` fixes a failure.
      - name: Formatting
        run: pnpm run format:check

      # Supply-chain gate: fail the build on a HIGH/CRITICAL advisory in a
      # production dependency so a new CVE cannot land silently. Scoped to
      # --prod (build/dev tooling is not shipped) and --audit-level=high so
      # transitive moderates in the dev toolchain do not block merges.
      # Run through pnpm 11 via dlx: npm retired the audit endpoint pnpm 10
      # calls (410 on every run since 2026-07); pnpm 11 uses the bulk advisory
      # endpoint and reads the same v9 lockfile. Install/build/test stay on
      # the workspace's pnpm 10 toolchain. npm's advisory transport is capped
      # so an outage cannot consume the whole job; only a confirmed transport
      # failure falls through to the independent, stricter OSV lockfile scan.
      - name: Dependency audit (prod, high+)
        id: npm-audit
        shell: bash
        run: |
          set +e
          timeout 90s pnpm dlx pnpm@11 audit --prod --audit-level=high \
            2>&1 | tee "$RUNNER_TEMP/pnpm-audit.log"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "transport_failure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$status" -eq 124 ]] || grep -Eqi \
            'TimeoutError|operation was aborted due to timeout|advisories/bulk error \(23\)' \
            "$RUNNER_TEMP/pnpm-audit.log"; then
            echo "transport_failure=true" >> "$GITHUB_OUTPUT"
            echo "::warning::npm advisory service unavailable; using the OSV fallback."
            exit 0
          fi

          exit "$status"

      - name: Dependency audit fallback (OSV full lockfile)
        if: steps.npm-audit.outputs.transport_failure == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml

      # Codegen drift: the OpenAPI spec is the contract; committed generated
      # clients must match it exactly or route validation silently diverges.
      - name: Codegen drift check
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-zod lib/api-client-react \
            || { echo "::error::Generated clients are stale — run 'pnpm --filter @workspace/api-spec run codegen' and commit."; exit 1; }

      - name: Typecheck (all packages)
        run: pnpm run typecheck

      # Drift tsc tolerates: unused imports/vars, hook-dependency mistakes.
      # Hook rules cover shared UI, every web app and mobile, and fail the gate.
      - name: Lint
        run: pnpm run lint

      # The api-server suite now includes DB-backed route tests (party access,
      # alert prefs, push registration) that run inside the RLS contexts, so both
      # the schema AND the guardrail migrations (meridian_app role grants, RLS
      # policies) must exist before they run.
      - name: Prepare database (schema + guardrail migrations)
        run: |
          pnpm --filter @workspace/db run push
          pnpm --filter @workspace/db run migrate

      # Golden-file UBL round-trips, lifecycle, matcher, connector contract —
      # the error catalogue doubling as the regression suite. Runs under V8
      # coverage (R118): the checked-in floors for auth, tenancy, money, the
      # Clerk gateway and the pipeline are enforced from the lcov it writes.
      - name: api-server unit tests with coverage floors
        run: pnpm --filter @workspace/api-server run test:coverage

      - name: Retain api-server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-coverage
          if-no-files-found: ignore
          path: |
            artifacts/api-server/coverage/lcov.info
            artifacts/api-server/coverage/summary.json

      # Pure form math behind the mobile invoice screens (no DB, no Expo).
      - name: mobile unit tests
        run: pnpm --filter @workspace/mobile run test

      # Pure CSV/xlsx import parsing + formatters/error helpers for the SME app.
      # Under Vitest's V8 coverage (R121): the floors for src/lib, the
      # components and the dashboard modules are enforced from its lcov.
      - name: SME app unit tests with coverage floors
        run: pnpm --filter @workspace/sme-compliance run test:coverage

      # Pure formatters, error helpers and Clerk health metrics for the console,
      # with floors for src/lib and the components (R121).
      - name: Console app unit tests with coverage floors
        run: pnpm --filter @workspace/console run test:coverage

      # Buyer-portal-specific badge vocabulary (the shared formatters are
      # covered by the lib suites below).
      - name: Buyer portal unit tests
        run: pnpm --filter @workspace/buyer-portal run test

      # Portal MFA/TOTP card logic for the landing app (the login portal).
      - name: Landing unit tests
        run: pnpm --filter @workspace/landing run test

      # Parity anchor for the s.104 penalty model the api-server hand-mirrors
      # (penalty-exposure.ts: "Mirrors penalty-calculator S104_PER_INVOICE —
      # keep in sync").
      - name: Penalty calculator unit tests
        run: pnpm --filter @workspace/penalty-calculator run test

      # The shared display formatters, API-error policy and headless UI
      # plumbing live in workspace libs (the apps re-export them); their
      # suites are the single home for those behaviors.
      - name: Shared lib unit tests
        run: pnpm --filter @workspace/format --filter @workspace/api-errors --filter @workspace/web-config run test

      # The shared workspace, operation-recovery and hook modules of web-ui
      # run under the same floors mechanism as the apps (R121).
      - name: web-ui unit tests with coverage floors
        run: pnpm --filter @workspace/web-ui run test:coverage

      - name: Retain web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          if-no-files-found: ignore
          path: |
            artifacts/sme-compliance/coverage/lcov.info
            artifacts/sme-compliance/coverage/summary.json
            artifacts/console/coverage/lcov.info
            artifacts/console/coverage/summary.json
            lib/web-ui/coverage/lcov.info
            lib/web-ui/coverage/summary.json

      # CORE-06: tables come from drizzle push; the versioned guardrail
      # migrations (triggers, RLS, retention) must apply AND roll back cleanly.
      - name: Migration rollback test (real Postgres)
        run: pnpm --filter @workspace/db run test

      - name: Migration-only upgrade matches the release catalog
        run: node node_modules/tsx/dist/cli.mjs --test scripts/src/ops/migration-upgrade.integration.mjs

      # The producer exports one snapshot for pg_dump, catalog and all row counts.
      # Keep backup data outside the checkout and trust the producer step output,
      # never a checksum read from an independently supplied sidecar.
      - name: Verify backup snapshot consistency and retained restore
        run: node --test scripts/src/ops/backup-restore.integration.mjs

      # Provision only this known login on the disposable CI service, never via restore.
      - name: Provision isolated backup runtime role
        run: >-
          node --input-type=module -e
          'import { psql } from "./scripts/src/ops/common.mjs";
          psql(process.env.DATABASE_URL, "CREATE ROLE meridian_backup_runtime LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT; GRANT meridian_app TO meridian_backup_runtime WITH SET TRUE");'

      - name: Retain snapshot-consistent backup
        id: retained-backup
        run: pnpm --filter @workspace/scripts run ops:backup
        env:
          BACKUP_DIR: ${{ runner.temp }}/meridian-backups
          BACKUP_RUNTIME_ROLE: meridian_backup_runtime

      - name: Restore retained backup and verify full semantic catalog
        run: pnpm --filter @workspace/scripts run ops:restore-drill
        env:
          BACKUP_MANIFEST: ${{ steps.retained-backup.outputs.manifest }}
          BACKUP_MANIFEST_SHA256: ${{ steps.retained-backup.outputs.manifest_sha256 }}
          DRILL_DATABASE_DISPOSABLE: '1'
          DRILL_CONFIRM_TARGET: meridian_drill_${{ github.run_id }}_${{ github.run_attempt }}
          DRILL_DATABASE_URL: postgresql://meridian:meridian@127.0.0.1:5432/meridian_drill_${{ github.run_id }}_${{ github.run_attempt }}

      - name: Build landing
        run: pnpm --filter @workspace/landing run build

      - name: Build console
        run: pnpm --filter @workspace/console run build

      - name: Build SME app
        run: pnpm --filter @workspace/sme-compliance run build

      - name: Build buyer portal
        run: pnpm --filter @workspace/buyer-portal run build

      - name: Build penalty calculator
        run: pnpm --filter @workspace/penalty-calculator run build

  # End-to-end user journeys against real builds and a real database — runs
  # the full journey suite; see scripts/src/e2e/journeys/ for the current
  # inventory.
  e2e:
    needs: quality-gate
    runs-on: ubuntu-latest
    # Local catalogue rendering added ~171s (excluding its build), route budgets ~34s.
    # Include browser installation, both build passes and DB journeys on slower runners.
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://meridian:meridian@127.0.0.1:5432/meridian_e2e
      E2E_DATABASE_DISPOSABLE: '1'
      BUILD_REVISION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Verify Valo vector and raster branding
        run: node scripts/branding-assets.mjs --check

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Verify built API PDF worker and native rasterization
        run: node --test scripts/src/e2e/pdf-runtime.test.mjs

      - name: Build immutable mobile native export and serving package
        run: node scripts/src/ops/mobile-artifact.mjs build

      - name: Verify packaged mobile manifests and native asset bytes
        run: node scripts/src/ops/mobile-artifact.mjs check

      - name: Axe engine and keyboard assertion regression
        run: node --test scripts/src/e2e/accessibility.test.mjs

      - name: Build frontends
        run: |
          BASE_PATH=/ PORT=3000 pnpm --filter @workspace/landing run build
          BASE_PATH=/console/ PORT=3000 pnpm --filter @workspace/console run build
          BASE_PATH=/app/ PORT=3000 pnpm --filter @workspace/sme-compliance run build
          BASE_PATH=/buyer/ PORT=3000 pnpm --filter @workspace/buyer-portal run build
          BASE_PATH=/penalty-calculator/ PORT=3000 pnpm --filter @workspace/penalty-calculator run build

      - name: Verify landing and login accessibility across public states
        run: node --test artifacts/landing/e2e/accessibility.test.mjs

      - name: Verify signed-in workspace visuals and keyboard focus
        run: node --test lib/web-ui/src/platform-visual.browser.test.mjs

      - name: Verify guided onboarding and operational workspace usability
        run: pnpm run test:workspace-usability

      - name: Verify calculator startup, loading and recovery accessibility
        run: node --test scripts/src/e2e/penalty-calculator-loading.test.mjs

      - name: Verify customer picker keyboard and failure recovery
        run: node --test scripts/src/e2e/customer-recovery.test.mjs

      - name: Verify activity, Clerk, WHT, filing, branding and header accessibility
        run: >-
          node --test --test-concurrency=1
          scripts/src/e2e/activity-accessibility.test.mjs
          scripts/src/e2e/clerk-wht-accessibility.test.mjs
          scripts/src/e2e/console-filing-branding-accessibility.test.mjs
          scripts/src/e2e/notification-trigger-contrast.test.mjs

      - name: Verify all Control Centre workspaces in both themes
        run: node node_modules/tsx/dist/cli.mjs artifacts/console/src/pages/control-centre/__tests__/browser.mjs

      - name: Push schema
        run: pnpm --filter @workspace/db run push

      - name: Render recovery states and verify accessibility
        run: node scripts/src/e2e/state-catalogue/run.mjs

      - name: Enforce lazy route and entry bundle budgets
        run: node scripts/src/e2e/state-catalogue/route-budget.mjs

      - name: Run E2E journeys
        run: pnpm --filter @workspace/scripts run e2e

      - name: Stamp tested immutable build manifest
        run: node scripts/src/ops/build-manifest.mjs

      - name: Preserve tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-release-${{ github.sha }}
          if-no-files-found: error
          # The inventory hashes hidden assets too; do not omit them in transport.
          include-hidden-files: true
          path: |
            release/build-manifest.json*
            artifacts/*/dist/**

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            scripts/test-results/**
            test-results/**
            tmp/state-catalogue-r198/**
            tmp/route-budget-r198/report.json
            tmp/route-budget-r198/*.build.log
            tmp/route-budget-r198/*/.vite/manifest.json
            artifacts/landing/tmp/accessibility/**
            tmp/penalty-calculator-loading/**
            tmp/reliability-customer-selectors/**
            tmp/activity-accessibility/**
            tmp/clerk-wht-accessibility/**
            tmp/control-centre-a11y-r198/**
            tmp/notification-trigger-contrast/**
            tmp/platform-refinement/**
            tmp/first-invoice/**
            tmp/business-details/**
            tmp/workspace-usability/**
            tmp/workspace-usability-hooks/**
            tmp/workspace-team-work/**
            tmp/workspace-created-task/**
